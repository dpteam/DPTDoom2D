name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build and check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The game data (doom2d.wad, music) is not committed: it is 6 MB of GPL
      # assets that already live upstream. Fetch them the same way a developer
      # would.
      - name: Fetch Doom2D data
        shell: pwsh
        run: ./DPTDOOM2D/tools/fetch-data.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # The port builds with the 9.0 SDK; the shipped binaries target net40
          # so they run on Windows XP and up.
          dotnet-version: '9.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet build DPTDOOM2D.slnx -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Every check here is the real game loop without a window, so it runs on a
      # headless runner: all 19 maps, save/load, the front end, and all 30 music
      # tracks through the XM replayer.
      - name: Headless checks
        shell: pwsh
        run: ./DPTDOOM2D/tools/build.ps1 -SkipTests

      # Two machines on one runner: a direct session, then a relayed one through
      # a local master. This is the path players use over the internet.
      - name: Network checks
        shell: pwsh
        run: |
          ./DPTDOOM2D/tools/net-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./DPTDOOM2D/tools/relay-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack
        shell: pwsh
        run: ./DPTDOOM2D/tools/build.ps1 -SkipTests -Pack

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DPTDOOM2D-win
          path: DPTDOOM2D/dist/DPTDOOM2D
          if-no-files-found: error
          retention-days: 30

      # Docs images are generated from the game's own framebuffer; keeping them
      # in the artifact lets a reviewer compare a build against the committed
      # screenshots without running anything.
      - name: Render docs images
        shell: pwsh
        run: ./DPTDOOM2D/tools/make-docs-images.ps1 -OutDir "${{ runner.temp }}/docs-images"

      - name: Upload docs images
        uses: actions/upload-artifact@v4
        with:
          name: docs-images
          path: ${{ runner.temp }}/docs-images
          if-no-files-found: warn
          retention-days: 7
