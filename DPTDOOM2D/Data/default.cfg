; DPT.DOOM 2D - default.cfg
;
; The keys are deliberately NOT listed here. They come from the layout preset
; (-layout 1 or 2, see docs/CONTROLS.md), so that switching presets is not
; immediately undone by nine-year-old numpad lines from 1996.
;
; To change a single key, either use the F2 overlay (Keys tab), which saves to
; Storage/default.cfg, or add a line here:
;
;   pl1_jump=x
;   pl1_fire=z
;
; Names are the SDL ones the original accepted: a single character, "up",
; "left shift", "kp 4", "page down", ...
;
; Everything below is unmodified from the 1996 default.cfg.

gamma=0
sound_volume=50
music_volume=60
screenshot=on
fullscreen=off
screen_width=800
screen_height=600
music_random=on
music_time=4
music_fade=6
sky=on
